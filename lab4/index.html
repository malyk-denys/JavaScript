<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна 4</title>
</head>
<body>
  <h1>Лабораторна 4</h1>
  <script src="sortlib.js"></script>
  <script>
    const normalArray = Array.from({ length: 120 }, (_, i) => (i * 13 + 7) % 100);

    const sparseArray = normalArray.slice();
    delete sparseArray[5];
    delete sparseArray[20];
    sparseArray[45] = undefined;
    delete sparseArray[75];
    sparseArray[100] = undefined;

    const methods = [
      SortLib.exchangeSort,
      SortLib.selectionSort,
      SortLib.insertionSort,
      SortLib.shellSort,
      SortLib.quickSort
    ];

    function showInConsole(title, arr) {
      console.log("====================================");
      console.log(title);
      console.log("Початковий масив:");
      console.log(arr);

      for (let i = 0; i < methods.length; i++) {
        const up = methods[i](arr, true);
        const down = methods[i](arr, false);

        console.log("------------------------------------");
        console.log(up.method);

        console.log("За зростанням:");
        console.log("Порівнянь:", up.comparisons);
        console.log("Переміщень:", up.moves);
        console.log(up.message);
        console.log(up.result);

        console.log("За спаданням:");
        console.log("Порівнянь:", down.comparisons);
        console.log("Переміщень:", down.moves);
        console.log(down.message);
        console.log(down.result);
      }
    }

    showInConsole("Звичайний масив (120 елементів)", normalArray);
    showInConsole("Розріджений масив (120 елементів)", sparseArray);
  </script>
</body>
</html>
