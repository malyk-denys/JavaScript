<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lights Out — Лабораторна робота №6</title>
  <link rel="stylesheet" href="styles.css" />
</head>бл
<body>
  <main class="app">
  <section class="stats">
    <div class="stat-card">
      <span>Час</span>
      <strong id="timer">00:00</strong>
    </div>

    <div class="stat-card">
      <span>Ходи</span>
      <strong id="moves">0</strong>
    </div>

    <div class="stat-card">
      <span>Ціль</span>
      <strong id="goal">0</strong>
    </div>

    <div class="stat-card">
      <span>Поле</span>
      <strong id="puzzle-id">-</strong>
    </div>
  </section>

  <section class="board-wrap">
    <div id="board"></div>
  </section>

  <section class="bottom-panel">
    <p id="status-message">Гра ще не розпочата.</p>
    <button id="reset-game-btn" type="button">Reset</button>
    <button id="new-game-btn" type="button">New Game</button>
  </section>
</main>
  <script src="script.js"></script>
</body>
</html>
